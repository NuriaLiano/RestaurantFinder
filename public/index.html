<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TasteMatch - encuentra un restaurante según lo que te apetece."
    />
    <title>TasteMatch</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">TasteMatch</p>
        <h1>¿Dónde comemos hoy?</h1>
        <p class="subtitle">
          Elige qué te apetece y cuánto quieres gastar. Nosotros hacemos el resto.
        </p>
      </section>

      <section class="card">
        <form id="recommendation-form">
          <label for="cuisine">Tipo de cocina</label>
          <select id="cuisine" name="cuisine" required>
            <option value="">Selecciona una opción</option>
          </select>

          <fieldset>
            <legend>Precio</legend>
            <div id="prices" class="price-options"></div>
          </fieldset>

          <button type="submit">Recomiéndame un restaurante</button>
        </form>

        <div id="result" class="result" aria-live="polite">
          <p class="placeholder">
            Tu recomendación aparecerá aquí.
          </p>
        </div>
      </section>

      <footer>
        <span>TasteMatch 1.0.0</span>
        <span id="service-status">Comprobando servicio…</span>
      </footer>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
